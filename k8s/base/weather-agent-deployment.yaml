apiVersion: apps/v1
kind: Deployment
metadata:
  name: weather-agent
  namespace: kagenti-demo
  labels:
    app.kubernetes.io/name: weather-agent
    app.kubernetes.io/component: agent
    kagenti.io/type: agent
    protocol.kagenti.io/a2a: "true"
  annotations:
    kagenti.io/description: "Weather service agent for demo"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: weather-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: weather-agent
        app.kubernetes.io/component: agent
        kagenti.io/type: agent
        protocol.kagenti.io/a2a: "true"
      annotations:
        kagenti.io/agentcard-path: "/.well-known/agent.json"
    spec:
      serviceAccountName: weather-agent
      containers:
      - name: agent
        image: "ghcr.io/kagenti/agent-examples/weather_service:v0.0.1-alpha.3"
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        env:
        - name: PORT
          value: "8000"
        - name: AGENT_NAME
          value: "Weather Service Agent"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        readinessProbe:
          httpGet:
            path: /.well-known/agent.json
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /.well-known/agent.json
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 30
        volumeMounts:
        - name: spiffe-workload-api
          mountPath: /spiffe-workload-api
          readOnly: true
      volumes:
      - name: spiffe-workload-api
        csi:
          driver: "csi.spiffe.io"
          readOnly: true
---
apiVersion: v1
kind: Service
metadata:
  name: weather-agent
  namespace: kagenti-demo
  labels:
    app.kubernetes.io/name: weather-agent
    kagenti.io/type: agent
spec:
  selector:
    app.kubernetes.io/name: weather-agent
  ports:
  - name: http
    port: 8000
    targetPort: 8000
    protocol: TCP
  type: ClusterIP
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: weather-agent
  namespace: kagenti-demo
  labels:
    app.kubernetes.io/name: weather-agent
